name: PH04 Reporting & Integrations
on:
  push:
    branches: [feat/pvh-ph04-reporting-integrations, 'fix/pvh-ph04-*']
  pull_request:
    branches: [feat/pvh-ph04-reporting-integrations]
permissions:
  contents: read
jobs:
  ph04:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ph04
      - run: node --experimental-strip-types --test tests/ph04-presentation.test.mjs
      - run: npm run build
