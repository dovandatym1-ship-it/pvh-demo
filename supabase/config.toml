# ====================================================================
# PVH Demo - Supabase Local Configuration
# Architecture: Next.js 15 + Supabase Local (ADR-001, ADR-002, D-05, D-06)
# Milestone: M0 (Sprint 0: Toolchain & Conventions)
# ====================================================================

project_id = "pvh-demo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public", "app"]
extra_search_path = ["public", "extensions", "app"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = false
port = 54323

[studio]
enabled = true
port = 54324
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54325
smtp_port = 54326
pop3_port = 54327

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.evidence]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["application/pdf", "image/png", "image/jpeg", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 12

[auth.email]
enable_confirmations = true
double_confirm_changes = false
enable_signup = false

[edge_runtime]
enabled = false
port = 54328

[analytics]
enabled = false
