name: CI

on:
  push:
    branches: [main, master, 'feat/pvh-ph02-core-workflow', 'feat/pvh-ph03-domain-verticals', 'fix/pvh-ph03-*']
  pull_request:
    branches: [main, master, 'feat/pvh-ph01-platform-auth', 'feat/pvh-ph02-core-workflow', 'feat/pvh-ph03-domain-verticals']

jobs:
  validate:
    name: Validate (Node 22 LTS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Copy environment template
        run: cp .env.example .env.local

      - name: Install dependencies
        run: npm ci

      - name: PH01 explicit-permission and demo-auth regression
        run: node --test tests/security/*.test.mjs

      - name: PH02 M01 workflow projection regression
        run: node --experimental-strip-types --test tests/m01-workflow-rules.test.mjs

      - name: PH03 static contract (not E2E)
        run: node --test tests/ph03-contract-static.test.mjs

      - name: PH03 Vietnamese display and form contract
        run: node --experimental-strip-types --test tests/ph03-presentation.test.mjs

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architectural Fitness Functions
        run: npm run fitness

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
