name: PH01 migration filename generation (temporary)

on:
  pull_request:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Discover Supabase CLI migration flags
        run: supabase migration new --help
      - name: Generate next migration filename with official CLI
        run: |
          supabase migration new ph01_security_contract
          find supabase/migrations -maxdepth 1 -type f -name '*ph01_security_contract.sql' -print
