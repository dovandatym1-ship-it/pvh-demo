name: PH06 Domain Data Safety
on:
  push:
    branches: ['fix/pvh-ph06-*']
  pull_request:
    branches: ['feat/pvh-ph06-domain-expansion-v2']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: cp .env.example .env.local
      - run: node --import tsx --test tests/ph06-data-safety.test.ts
      - run: node --test tests/security/*.test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run fitness
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
# Static & unit tests only. Not RLS/DB/Storage/browser E2E evidence.
